    <line x1="72" y1="248" x2="640" y2="248" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="652" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b6b6b">chance</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="214,174.2 498,133.2" stroke="#1F8A65" stroke-width="3"/>
      <polyline points="214,166 498,190.6" stroke="#6B6B7B" stroke-width="3"/>
      <polyline points="214,190.6 498,157.8" stroke="#C44848" stroke-width="3"/>
    </g>
    <g stroke="#ffffff" stroke-width="2">
      <circle cx="214" cy="174.2" r="6" fill="#1F8A65"/>
      <circle cx="498" cy="133.2" r="6" fill="#1F8A65"/>
      <circle cx="214" cy="166" r="6" fill="#6B6B7B"/>
      <circle cx="498" cy="190.6" r="6" fill="#6B6B7B"/>
      <circle cx="214" cy="190.6" r="6" fill="#C44848"/>
      <circle cx="498" cy="157.8" r="6" fill="#C44848"/>
    </g>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
      <text x="190" y="178" text-anchor="end" fill="#1F8A65">72.5%</text>
      <text x="498" y="119" text-anchor="middle" fill="#1F8A65">85%</text>
      <text x="214" y="152" text-anchor="middle" fill="#6B6B7B">75%</text>
      <text x="498" y="214" text-anchor="middle" fill="#6B6B7B">67.5%</text>
      <text x="214" y="214" text-anchor="middle" fill="#C44848">67.5%</text>
      <text x="524" y="162" text-anchor="start" fill="#C44848">77.5%</text>
    </g>

    <line x1="72" y1="84" x2="72" y2="412" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="72" y1="412" x2="640" y2="412" stroke="#8a8a8a" stroke-width="1"/>
    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">
      <text x="214" y="436" text-anchor="middle">60 / 40</text>
      <text x="498" y="436" text-anchor="middle">65 / 35</text>
    </g>
    <text x="18" y="248" text-anchor="middle" transform="rotate(-90 18 248)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5c5c5c">Percent correct</text>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">
      <line x1="72" y1="484" x2="100" y2="484" stroke="#1F8A65" stroke-width="3"/>
      <circle cx="86" cy="484" r="5" fill="#1F8A65"/>
      <text x="108" y="489">Help</text>
      <line x1="176" y1="484" x2="204" y2="484" stroke="#6B6B7B" stroke-width="3"/>
      <circle cx="190" cy="484" r="5" fill="#6B6B7B"/>
      <text x="212" y="489">Control</text>
      <line x1="300" y1="484" x2="328" y2="484" stroke="#C44848" stroke-width="3"/>
      <circle cx="314" cy="484" r="5" fill="#C44848"/>
      <text x="336" y="489">Hurt</text>
    </g>
