<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" width="1160" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Keep group morph figure, expanded Pilot 4 (submits at most 7, n = 20)</title>
  <desc id="desc">Left: 50/50 in-group 55% vs out-of-triad 45%. Right: P(correct) at mix 60 and 65 for help, control, and hurt.</desc>

  <rect width="1160" height="540" fill="#ffffff"/>
  <text x="580" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" fill="#1a1a1a">Join submits &lt;= 7  |  n = 20  |  expanded sample</text>

  <g transform="translate(0,10)">
    <text x="220" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">50 / 50 - who they picked</text>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5c5c5c">
      <text x="60" y="88" text-anchor="end">100%</text>
      <text x="60" y="170" text-anchor="end">75%</text>
      <text x="60" y="252" text-anchor="end">50%</text>
      <text x="60" y="334" text-anchor="end">25%</text>
      <text x="60" y="416" text-anchor="end">0%</text>
    </g>
    <g stroke="#e6e6e6" stroke-width="1" fill="none">
      <line x1="72" y1="84" x2="360" y2="84"/>
      <line x1="72" y1="166" x2="360" y2="166"/>
      <line x1="72" y1="248" x2="360" y2="248"/>
      <line x1="72" y1="330" x2="360" y2="330"/>
      <line x1="72" y1="412" x2="360" y2="412"/>
    </g>

    <rect x="150" y="231.6" width="132" height="180.4" fill="#2E79B5"/>
    <rect x="150" y="84" width="132" height="147.6" fill="#B4B4C0"/>
    <text x="216" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">55%</text>
    <text x="216" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#2a2a2a">45%</text>

    <line x1="72" y1="248" x2="360" y2="248" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="368" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b6b6b">chance</text>
    <line x1="72" y1="84" x2="72" y2="412" stroke="#8a8a8a" stroke-width="1"/>
    <line x1="72" y1="412" x2="360" y2="412" stroke="#8a8a8a" stroke-width="1"/>
    <text x="216" y="436" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">50 / 50</text>
    <text x="18" y="248" text-anchor="middle" transform="rotate(-90 18 248)" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#5c5c5c">Percent of choices</text>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a1a1a">
      <rect x="78" y="468" width="14" height="14" fill="#2E79B5"/>
      <text x="98" y="480">In-group</text>
      <rect x="196" y="468" width="14" height="14" fill="#B4B4C0"/>
      <text x="216" y="480">Out-of-triad</text>
    </g>
  </g>

  <g transform="translate(430,10)">
    <text x="360" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a1a1a">60 and 65 - P(correct)</text>

    <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5c5c5c">
      <text x="60" y="88" text-anchor="end">100%</text>
      <text x="60" y="170" text-anchor="end">75%</text>
      <text x="60" y="252" text-anchor="end">50%</text>
      <text x="60" y="334" text-anchor="end">25%</text>
      <text x="60" y="416" text-anchor="end">0%</text>
    </g>
    <g stroke="#e6e6e6" stroke-width="1" fill="none">
      <line x1="72" y1="84" x2="640" y2="84"/>
      <line x1="72" y1="166" x2="640" y2="166"/>
      <line x1="72" y1="248" x2="640" y2="248"/>
      <line x1="72" y1="330" x2="640" y2="330"/>
      <line x1="72" y1="412" x2="640" y2="412"/>
