    <circle cx="498" cy="220.8" r="6" fill="#6B6B7B"/>
    <circle cx="214" cy="220.8" r="6" fill="#C44848"/>
    <circle cx="498" cy="138.8" r="6" fill="#C44848"/>
  </g>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600">
    <text x="214" y="152" text-anchor="middle" fill="#1F8A65">75%</text>
    <text x="498" y="111" text-anchor="middle" fill="#1F8A65">87.5%</text>
    <text x="238" y="188" text-anchor="start" fill="#6B6B7B">66.7%</text>
    <text x="498" y="244" text-anchor="middle" fill="#6B6B7B">58.3%</text>
    <text x="214" y="244" text-anchor="middle" fill="#C44848">58.3%</text>
    <text x="524" y="142" text-anchor="start" fill="#C44848">83.3%</text>
