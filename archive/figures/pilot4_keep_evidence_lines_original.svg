<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="title desc">
  <title id="title">P(correct) at mix 60 and 65, original keep group (n = 12)</title>
  <desc id="desc">Help 75% then 87.5%; control 66.7% then 58.3%; hurt 58.3% then 83.3%.</desc>
  <rect width="720" height="520" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">60 and 65 - P(correct)</text>
  <text x="360" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5c5c5c">submits &lt;= 7 � n = 12 � original sample</text>
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#5c5c5c">
    <text x="60" y="88" text-anchor="end">100%</text>
    <text x="60" y="170" text-anchor="end">75%</text>
    <text x="60" y="252" text-anchor="end">50%</text>
    <text x="60" y="334" text-anchor="end">25%</text>
    <text x="60" y="416" text-anchor="end">0%</text>
  </g>
  <g stroke="#e6e6e6" stroke-width="1" fill="none">
    <line x1="72" y1="84" x2="640" y2="84"/>
    <line x1="72" y1="166" x2="640" y2="166"/>
    <line x1="72" y1="248" x2="640" y2="248"/>
    <line x1="72" y1="330" x2="640" y2="330"/>
    <line x1="72" y1="412" x2="640" y2="412"/>
  </g>
  <line x1="72" y1="248" x2="640" y2="248" stroke="#6b6b6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="652" y="252" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#6b6b6b">chance</text>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="214,166 498,125" stroke="#1F8A65" stroke-width="3"/>
    <polyline points="214,193.2 498,220.8" stroke="#6B6B7B" stroke-width="3"/>
    <polyline points="214,220.8 498,138.8" stroke="#C44848" stroke-width="3"/>
  </g>
  <g stroke="#ffffff" stroke-width="2">
