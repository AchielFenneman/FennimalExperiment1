<?xml version="1.0" encoding="UTF-8"?>
<!--
  SUPPORT Figure 1  default academic muted palette
  Easiest color edits: open figure1.html
  Direct SVG edits: change the hex values below, then the matching fill/stroke attributes.

  Page background:        #FFFFFF
  Triangle fill:          #EEF1F4
  Triangle lines:         #8A949E
  Center fill:            #FFFFFF
  Center outline:         #D0D6DC
  Center text:            #2C3A43
  WP1 fill / outline / text:  #E4F0F6 / #4F86A0 / #1E4458
  WP2 fill / outline / text:  #E5F1E8 / #4F8A5C / #1E3F28
  WP3 fill / outline / text:  #EDE8F4 / #6B5E8C / #2E2744
  Social media fill:      #E4DCF0
  AI chatbots fill:       #F1F0F3
  WP3 divider:            #B7AEC8
  AI dashed outline:      #8A829A
  Across-contexts text:   #5C6770
  Arrow:                  #8A9299
  Mental health text:     #4A535A
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 358" width="160mm" height="57.28mm" role="img" aria-labelledby="fig-title fig-desc" font-family="Segoe UI, Calibri, Helvetica Neue, Arial, sans-serif">
  <title id="fig-title">SUPPORT conceptual overview of three interconnected work packages</title>
  <desc id="fig-desc">WP1 friends and peer networks, WP2 parents, and WP3 digital environments (social media and AI chatbots) around support seeking and coping, with mental health as a downstream outcome.</desc>

  <rect x="0" y="0" width="1000" height="358" fill="#FFFFFF"/>

  <polygon points="500,41 200,221 809,221" fill="#EEF1F4"/>
  <polygon points="500,41 200,221 809,221" fill="none" stroke="#8A949E" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <rect x="380" y="112" width="240" height="58" rx="12" fill="#FFFFFF"/>
  <rect x="380" y="112" width="240" height="58" rx="12" fill="none" stroke="#D0D6DC" stroke-width="1.3"/>
  <text text-anchor="middle" fill="#2C3A43" font-weight="600" letter-spacing="0.04em">
    <tspan x="500" y="135" font-size="18">SUPPORT SEEKING</tspan>
    <tspan x="500" y="157" font-size="18">&amp; COPING</tspan>
  </text>

  <g id="wp1">
    <rect x="320" y="12" width="360" height="58" rx="9" fill="#E4F0F6"/>
    <rect x="320" y="12" width="360" height="58" rx="9" fill="none" stroke="#4F86A0" stroke-width="1.8"/>
    <text text-anchor="middle" x="500" y="34" fill="#1E4458" font-size="15" font-weight="600" letter-spacing="0.08em">WP1</text>
    <text text-anchor="middle" x="500" y="56" fill="#1E4458" font-size="18" font-weight="600">Friends &amp; peer networks</text>
  </g>

  <g id="wp2">
    <rect x="68" y="192" width="264" height="58" rx="9" fill="#E5F1E8"/>
    <rect x="68" y="192" width="264" height="58" rx="9" fill="none" stroke="#4F8A5C" stroke-width="1.8"/>
    <text text-anchor="middle" x="200" y="214" fill="#1E3F28" font-size="15" font-weight="600" letter-spacing="0.08em">WP2</text>
    <text text-anchor="middle" x="200" y="236" fill="#1E3F28" font-size="18" font-weight="600">Parents</text>
  </g>

  <g id="wp3">
    <defs>
      <clipPath id="wp3-clip">
        <rect x="638" y="160" width="342" height="90" rx="9"/>
      </clipPath>
    </defs>
    <g clip-path="url(#wp3-clip)">
      <rect x="638" y="160" width="342" height="90" fill="#EDE8F4"/>
      <rect x="638" y="218" width="171" height="32" fill="#E4DCF0"/>
      <rect x="809" y="218" width="171" height="32" fill="#F1F0F3"/>
    </g>
    <rect x="638" y="160" width="342" height="90" rx="9" fill="none" stroke="#6B5E8C" stroke-width="1.9"/>
    <line x1="638" y1="218" x2="980" y2="218" stroke="#B7AEC8" stroke-width="1.15"/>
    <line x1="809" y1="218" x2="809" y2="250" stroke="#B7AEC8" stroke-width="1.15"/>
    <rect x="814" y="222" width="161" height="24" rx="3" fill="none" stroke="#8A829A" stroke-width="1.25" stroke-dasharray="3.2 2.2"/>
    <text text-anchor="middle" x="809" y="180" fill="#2E2744" font-size="15" font-weight="600" letter-spacing="0.08em">WP3</text>
    <text text-anchor="middle" x="809" y="204" fill="#2E2744" font-size="18" font-weight="600">Digital environments</text>
    <text text-anchor="middle" x="723.5" y="240" fill="#2E2744" font-size="16" font-weight="600">Social media</text>
    <text text-anchor="middle" x="894.5" y="240" fill="#2E2744" font-size="16" font-weight="600">AI chatbots</text>
  </g>

  <text text-anchor="middle" x="500" y="278" fill="#5C6770" font-size="14.5">Across contexts: correspondence � supplementation � substitution</text>

  <g fill="#8A9299" stroke="#8A9299">
    <line x1="500" y1="290" x2="500" y2="316" fill="none" stroke-width="1.6"/>
    <polygon points="500,323 493.6,312 506.4,312"/>
  </g>
  <text text-anchor="middle" x="500" y="346" fill="#4A535A" font-size="16" font-weight="600" letter-spacing="0.08em">MENTAL HEALTH</text>
</svg>
