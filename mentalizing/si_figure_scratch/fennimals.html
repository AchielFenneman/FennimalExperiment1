<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SI scratch — Fennimals</title>
  <link rel="stylesheet" href="../../maincss.css?v=overlay-1" />
  <style>
    :root { color: #222; font-family: "Segoe UI", system-ui, sans-serif; }
    html, body {
      height: auto;
      min-height: 100%;
      overflow: auto;
      background: #e8e8e8;
    }
    body { margin: 0; padding: 28px; }
    h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 6px; }
    p.note { margin: 0 0 16px; max-width: 56rem; line-height: 1.45; color: #444; }
    button {
      font: inherit;
      padding: 4px 10px;
      border: 1px solid #888;
      background: #fff;
      cursor: pointer;
    }
    button:hover { background: #f4f4f4; }
    table { border-collapse: separate; border-spacing: 14px 16px; }
    th { text-align: left; font-size: 0.95rem; vertical-align: bottom; }
    td { vertical-align: top; }
    figure { margin: 0; }
    .panel { line-height: 0; overflow: hidden; }
    .panel svg { display: block; transform-origin: top left; }
    figcaption { margin-top: 4px; font-size: 0.75rem; line-height: 1.3; color: #333; }
    .rowhead { white-space: nowrap; padding-right: 8px; vertical-align: middle; }
    #status { color: #8a1f1f; }
    #measure-host {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <svg id="Scannimals_Task_SVG" width="1920" height="1080" style="position:absolute;left:-9000px;width:10px;height:10px"></svg>
  <h1>Fennimals</h1>
  <p class="note" id="intro">Loading the head and body artwork…</p>
  <p id="status" hidden></p>
  <div id="root"></div>

  <script src="../../src/1_General_functions.js?v=parrot-happy-1"></script>
  <script src="../../src/1_General_Parameters.js?v=head-dropdown-5"></script>
  <script>
    const HEADS = [
      ["astro", "Astro"],
      ["cupcake", "Cupcake"],
      ["tube", "Tube"],
      ["tv", "TV"],
      ["jackolantern", "Jack-o'-lantern"],
      ["elephant", "Elephant"],
      ["blockhead", "Blockhead"],
      ["parrot", "Parrot"]
    ];
    const REGION_ORDER = ["Jungle", "Village", "North", "Desert"];
    const LOCATIONS = {
      Jungle: ["bush", "lake", "limestone", "rainforest"],
      Village: ["church", "farm", "gatehouse", "manor"],
      North: ["iceberg", "igloo", "pineforest", "snowman"],
      Desert: ["cactus", "camp", "oasis", "wagon"]
    };
    const CELL_PX = 220;
    const MASK_OPACITY = 0.8;

    function hashString(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function pickLocation(headId, region) {
      const list = LOCATIONS[region];
      return list[hashString(headId + "|" + region) % list.length];
    }

    function locationLabel(loc) {
      const key = loc.charAt(0).toUpperCase() + loc.slice(1);
      if (GenParam.get_display_name_of_location) return GenParam.get_display_name_of_location(key);
      return key;
    }

    async function loadTemplates(path, className) {
      const response = await fetch("../../" + path);
      if (!response.ok) throw new Error(path + " returned " + response.status);
      const holder = document.createElement("div");
      holder.style.display = "none";
      document.body.appendChild(holder);
      holder.innerHTML = await response.text();
      const nodes = Array.from(holder.getElementsByClassName(className));
      nodes.forEach((node) => set_Fennimal_color_classes(node));
      const host = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      host.setAttribute("id", "templates_" + className);
      host.style.position = "absolute";
      host.style.left = "-9000px";
      host.style.width = "10px";
      host.style.height = "10px";
      document.body.appendChild(host);
      nodes.forEach((node) => host.appendChild(node));
      holder.remove();
    }

    function colorSchemeFor(region) {
      const colors = GenParam.RegionData[region].Fennimal_location_colors;
      const head = {
        primary_color: colors.primary_color,
        secondary_color: colors.secondary_color,
        tertiary_color: colors.tertiary_color,
        eye_color: colors.eye_color
      };
      return {
        Head: head,
        Body: {
          primary_color: colors.primary_color,
          secondary_color: colors.secondary_color,
          tertiary_color: colors.tertiary_color
        }
      };
    }

    function makeFennimal(headId, region) {
      const fen = create_Fennimal_SVG_object({
        id: headId + "_" + region,
        head: headId,
        body: GenParam.RegionData[region].preferredBodyType,
        region: region,
        ColorScheme: colorSchemeFor(region)
      }, GenParam.Fennimal_head_size, false);
      fen.querySelectorAll(".invisible_element").forEach((el) => {
        el.style.display = "none";
      });
      // Snow, heat, and spores are drawn only while their animation is running.
      // At rest their artwork sits at opacity 0, and that invisible art must not
      // enlarge the shared frame.
      fen.querySelectorAll('[class*="snowflake"], [class*="heat_wave"], [class*="spore_"]').forEach((el) => {
        el.style.display = "none";
      });
      if (typeof set_fennimal_expression_visibility === "function") {
        set_fennimal_expression_visibility(fen, "happy");
      }
      if (typeof freeze_fennimal_decorative_animations === "function") {
        freeze_fennimal_decorative_animations(fen);
      }
      const body = fen.getElementsByClassName("Fennimal_body")[0];
      if (body) body.style.transform = "translate(0px, 0px) scale(1, 1)";
      const head = fen.getElementsByClassName("Fennimal_head")[0];
      if (head) head.style.transform = "translate(0px, 0px) rotate(0deg)";
      fen.querySelectorAll(".eye_gaze").forEach((eye) => {
        eye.style.transformOrigin = "center";
        eye.style.transformBox = "fill-box";
        eye.style.transform = "translate(0px, 0px) scale(1.15)";
      });
      return fen;
    }

    function visualBox(svg, el) {
      const svgRect = svg.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      const sx = svg.width.baseVal.value / svgRect.width;
      const sy = svg.height.baseVal.value / svgRect.height;
      return {
        x: (rect.left - svgRect.left) * sx,
        y: (rect.top - svgRect.top) * sy,
        width: rect.width * sx,
        height: rect.height * sy
      };
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    function downloadPng(canvas, filename) {
      canvas.toBlob((blob) => downloadBlob(blob, filename), "image/png");
    }

    function crc32(bytes) {
      if (!crc32.table) {
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          table[n] = c >>> 0;
        }
        crc32.table = table;
      }
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) {
        crc = crc32.table[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function zipStore(files) {
      const encoder = new TextEncoder();
      const parts = [];
      const central = [];
      let offset = 0;
      files.forEach((file) => {
        const name = encoder.encode(file.name);
        const data = file.data;
        const crc = crc32(data);
        const local = new Uint8Array(30 + name.length);
        const view = new DataView(local.buffer);
        view.setUint32(0, 0x04034b50, true);
        view.setUint16(4, 20, true);
        view.setUint16(8, 0, true);
        view.setUint32(14, crc, true);
        view.setUint32(18, data.length, true);
        view.setUint32(22, data.length, true);
        view.setUint16(26, name.length, true);
        local.set(name, 30);
        parts.push(local, data);

        const entry = new Uint8Array(46 + name.length);
        const centralView = new DataView(entry.buffer);
        centralView.setUint32(0, 0x02014b50, true);
        centralView.setUint16(4, 20, true);
        centralView.setUint16(6, 20, true);
        centralView.setUint32(16, crc, true);
        centralView.setUint32(20, data.length, true);
        centralView.setUint32(24, data.length, true);
        centralView.setUint16(28, name.length, true);
        centralView.setUint32(42, offset, true);
        entry.set(name, 46);
        central.push(entry);
        offset += local.length + data.length;
      });
      let centralSize = 0;
      central.forEach((entry) => { centralSize += entry.length; });
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, files.length, true);
      endView.setUint16(10, files.length, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, offset, true);
      return new Blob([...parts, ...central, end], { type: "application/zip" });
    }

    function coverDraw(ctx, img, w, h) {
      const imageRatio = img.naturalWidth / img.naturalHeight;
      const frameRatio = w / h;
      let sx = 0;
      let sy = 0;
      let sw = img.naturalWidth;
      let sh = img.naturalHeight;
      if (imageRatio > frameRatio) {
        sw = img.naturalHeight * frameRatio;
        sx = (img.naturalWidth - sw) / 2;
      } else {
        sh = img.naturalWidth / frameRatio;
        sy = (img.naturalHeight - sh) / 2;
      }
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    }

    async function loadImage(src) {
      const img = new Image();
      img.src = src;
      await img.decode();
      return img;
    }

    const exports = [];

    async function build() {
      const intro = document.getElementById("intro");
      const status = document.getElementById("status");
      try {
        GenParam = new GENERALPARAM();
        await loadTemplates("SVG/Heads.svg", "Fennimal_head");
        await loadTemplates("SVG/Bodies.svg", "Fennimal_body");
      } catch (err) {
        status.hidden = false;
        status.textContent = "Could not load the Fennimal artwork. Open this page from the experiment server.";
        intro.textContent = "";
        return;
      }

      const host = document.createElement("div");
      host.id = "measure-host";
      const measure = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      measure.setAttribute("width", "4000");
      measure.setAttribute("height", "4000");
      measure.setAttribute("overflow", "visible");
      host.appendChild(measure);
      document.body.appendChild(host);

      const built = [];
      let maxW = 0;
      let maxH = 0;
      HEADS.forEach(([headId]) => {
        REGION_ORDER.forEach((region) => {
          const fen = makeFennimal(headId, region);
          measure.appendChild(fen);
          const box = visualBox(measure, fen);
          maxW = Math.max(maxW, box.width);
          maxH = Math.max(maxH, box.height);
          built.push({ headId, region, fen, box });
        });
      });

      const pad = Math.max(maxW, maxH) * 0.04;
      const cellW = maxW + pad * 2;
      const cellH = maxH + pad * 2;
      const displayW = Math.round(CELL_PX * (cellW / cellH));
      const displayH = CELL_PX;

      intro.textContent = "Each cell is one head on that region’s body, in the resting pose, centered in one shared frame. The photo is a location from that region, cropped rather than stretched, with the same white veil used when a Fennimal is met.";

      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      headRow.appendChild(document.createElement("th"));
      REGION_ORDER.forEach((region) => {
        const th = document.createElement("th");
        th.textContent = GenParam.RegionData[region].display_name;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      const byKey = {};
      built.forEach((row) => { byKey[row.headId + "|" + row.region] = row; });

      for (const [headId, headLabel] of HEADS) {
        const tr = document.createElement("tr");
        const rh = document.createElement("th");
        rh.className = "rowhead";
        rh.textContent = headLabel;
        tr.appendChild(rh);

        for (const region of REGION_ORDER) {
          const item = byKey[headId + "|" + region];
          const tx = pad + (maxW - item.box.width) / 2 - item.box.x;
          const ty = pad + (maxH - item.box.height) / 2 - item.box.y;
          item.fen.setAttribute("transform", "translate(" + tx + " " + ty + ")");

          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("xmlns", ns);
          svg.setAttribute("width", String(cellW));
          svg.setAttribute("height", String(cellH));
          svg.setAttribute("viewBox", "0 0 " + cellW + " " + cellH);
          const displayScale = displayH / cellH;
          svg.style.transform = "scale(" + displayScale + ")";

          const loc = pickLocation(headId, region);
          const image = document.createElementNS(ns, "image");
          image.setAttribute("href", "../../Locations/" + region + "_" + loc + ".png");
          image.setAttribute("x", "0");
          image.setAttribute("y", "0");
          image.setAttribute("width", String(cellW));
          image.setAttribute("height", String(cellH));
          image.setAttribute("preserveAspectRatio", "xMidYMid slice");
          svg.appendChild(image);

          const veil = document.createElementNS(ns, "rect");
          veil.setAttribute("x", "0");
          veil.setAttribute("y", "0");
          veil.setAttribute("width", String(cellW));
          veil.setAttribute("height", String(cellH));
          veil.setAttribute("fill", "#ffffff");
          veil.setAttribute("opacity", String(MASK_OPACITY));
          svg.appendChild(veil);
          svg.appendChild(item.fen);

          const td = document.createElement("td");
          const figure = document.createElement("figure");
          const panel = document.createElement("div");
          panel.className = "panel";
          panel.style.width = displayW + "px";
          panel.style.height = displayH + "px";
          panel.appendChild(svg);
          const caption = document.createElement("figcaption");
          caption.appendChild(document.createTextNode(locationLabel(loc)));
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "PNG";
          const filename = "fennimal_" + headId + "_" + region.toLowerCase() + "_" + loc + ".png";
          button.addEventListener("click", () => exportOne(item, filename));
          caption.appendChild(document.createTextNode(" "));
          caption.appendChild(button);
          figure.appendChild(panel);
          figure.appendChild(caption);
          td.appendChild(figure);
          tr.appendChild(td);

          exports.push({ item, filename, loc, region });
        }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);

      const bar = document.createElement("p");
      const all = document.createElement("button");
      all.type = "button";
      all.textContent = "Download all as ZIP";
      all.addEventListener("click", async () => {
        const previous = all.textContent;
        all.disabled = true;
        all.textContent = "Preparing zip…";
        try {
          const files = [];
          for (const row of exports) {
            const canvas = await renderOne(row.item, row.filename, row);
            const png = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
            files.push({ name: row.filename, data: new Uint8Array(await png.arrayBuffer()) });
          }
          downloadBlob(zipStore(files), "fennimals.zip");
        } finally {
          all.disabled = false;
          all.textContent = previous;
        }
      });
      bar.appendChild(all);
      document.getElementById("root").appendChild(bar);
      document.getElementById("root").appendChild(table);

      async function renderOne(item, filename, meta) {
        const found = meta || exports.find((row) => row.item === item);
        const img = await loadImage("../../Locations/" + found.region + "_" + found.loc + ".png");
        const scale = 3;
        const canvas = document.createElement("canvas");
        canvas.width = displayW * scale;
        canvas.height = displayH * scale;
        const ctx = canvas.getContext("2d");
        coverDraw(ctx, img, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255,255,255," + MASK_OPACITY + ")";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const lone = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        lone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
        lone.setAttribute("width", String(cellW));
        lone.setAttribute("height", String(cellH));
        lone.setAttribute("viewBox", "0 0 " + cellW + " " + cellH);
        const clone = item.fen.cloneNode(true);
        lone.appendChild(clone);
        const xml = new XMLSerializer().serializeToString(lone);
        const blob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const painted = new Image();
        await new Promise((resolve, reject) => {
          painted.onload = () => resolve();
          painted.onerror = () => reject(new Error("Could not draw " + filename));
          painted.src = url;
        });
        ctx.drawImage(painted, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        return canvas;
      }

      function exportOne(item, filename) {
        return renderOne(item, filename).then((canvas) => downloadPng(canvas, filename));
      }
    }

    build();
  </script>
</body>
</html>
