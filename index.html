<script type="module">
    // 1. Import the Firebase tools directly from Google's servers
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. PASTE YOUR CONFIG OBJECT HERE (From the Firebase Console)
    const firebaseConfig = {
        apiKey: "AIzaSyBLYsCJDNs9JO3bNi3RSCBZFHegtH1OI_I",
        authDomain: "fennimals.firebaseapp.com",
        projectId: "fennimals",
        storageBucket: "fennimals.firebasestorage.app",
        messagingSenderId: "416848310750",
        appId: "1:416848310750:web:1fd80297bf7b6389472d4f"
    };

    // 3. Initialize Firebase and create global helpers for Top_controller.js
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.SESSION_CLAIM_COLLECTION = "fennimals_claims";
    window.SAVE_DUMP_COLLECTION = "fennimals_save_dumps";

    // Firestore rejects arrays-of-arrays, undefined, and NaN. JSON.stringify
    // allows all three, so a phase log can look fine in-memory and still fail
    // the write — after which every later save of the same document fails too.
    // Applied to every saveToFirebase payload (experiment docs and claims).
    function sanitizeForFirestore(value, path, stats) {
        if (value === undefined) return undefined;
        if (typeof value === "number" && !Number.isFinite(value)) return null;
        if (Array.isArray(value)) {
            return value.map((item, i) => {
                let nextPath = path + "[" + i + "]";
                let converted = sanitizeForFirestore(item, nextPath, stats);
                if (Array.isArray(converted)) {
                    stats.nestedArrays.push(nextPath);
                    return { values: converted };
                }
                return converted;
            });
        }
        if (value && typeof value === "object") {
            if (typeof Node !== "undefined" && value instanceof Node) return null;
            if (value instanceof Date) return value;
            let out = {};
            Object.keys(value).forEach((key) => {
                if (value[key] === undefined) return;
                out[key] = sanitizeForFirestore(value[key], path ? path + "." + key : key, stats);
            });
            return out;
        }
        return value;
    }

    function experimentDataToJsonString(experiment_data) {
        try {
            return JSON.stringify(experiment_data);
        } catch (e) {
            try {
                return JSON.stringify(sanitizeForFirestore(experiment_data, "", { nestedArrays: [] }));
            } catch (e2) {
                return JSON.stringify({
                    stringifyFailed: String(e),
                    sanitizeFailed: String(e2),
                    pid: experiment_data && experiment_data.pid || null
                });
            }
        }
    }

    // Last-resort backup when the structured experiment write fails.
    // Strings are legal Firestore values, so this bypasses nested-array
    // (and most schema) rejections. Chunks stay under the 1MB doc limit.
    // Does not throw — a failed dump must never block the participant.
    async function dumpExperimentLastResort(originalCollection, originalDocId, experiment_data, error) {
        const json = experimentDataToJsonString(experiment_data);
        const CHUNK = 800000;
        const chunks = [];
        for (let i = 0; i < json.length; i += CHUNK) chunks.push(json.slice(i, i + CHUNK));

        const dumpedAt = new Date().toISOString();
        const dumpId = String(originalDocId || ("unknown_" + Date.now()));
        const col = window.SAVE_DUMP_COLLECTION;
        const meta = {
            kind: "meta",
            pid: (experiment_data && experiment_data.pid) || null,
            expCode: (experiment_data && experiment_data.expCode) || originalCollection,
            attemptDocId: dumpId,
            originalCollection: originalCollection,
            originalDocId: originalDocId,
            dumpedAt: dumpedAt,
            saveError: (error && (error.message || String(error))) || "unknown",
            saveErrorCode: (error && error.code) || null,
            experimentCompleted: !!(experiment_data && experiment_data.experimentCompleted),
            nChunks: chunks.length,
            jsonChars: json.length,
            encoding: "json-string-chunks",
            howToReassemble: "Concatenate json (if present) or jsonChunk from __c0..__c{nChunks-1} in order, then JSON.parse."
        };

        if (chunks.length === 1) {
            meta.json = chunks[0];
            await setDoc(doc(db, col, dumpId), meta);
            console.warn("Last-resort save dump written to", col + "/" + dumpId, "(" + json.length + " chars)");
            return true;
        }

        meta.json = null;
        await setDoc(doc(db, col, dumpId), meta);
        for (let i = 0; i < chunks.length; i++) {
            await setDoc(doc(db, col, dumpId + "__c" + i), {
                kind: "chunk",
                attemptDocId: dumpId,
                originalCollection: originalCollection,
                expCode: meta.expCode,
                pid: meta.pid,
                chunkIndex: i,
                nChunks: chunks.length,
                jsonChunk: chunks[i],
                dumpedAt: dumpedAt
            });
        }
        console.warn("Last-resort save dump written to", col + "/" + dumpId, "in", chunks.length, "chunks");
        return true;
    }

    window.saveToFirebase = async function(collection_name, doc_id, experiment_data) {
        const stats = { nestedArrays: [] };
        const payload = sanitizeForFirestore(experiment_data, "", stats);
        if (stats.nestedArrays.length) {
            console.warn(
                "Firestore sanitize: wrapped nested arrays at",
                stats.nestedArrays.slice(0, 12),
                stats.nestedArrays.length > 12 ? ("… +" + (stats.nestedArrays.length - 12) + " more") : ""
            );
        }
        try {
            const docRef = doc(db, collection_name, doc_id);
            await setDoc(docRef, payload, { merge: true });
            return true;
        } catch (e) {
            console.error("Error saving to Firebase: ", e);
            const skipDump = collection_name === window.SESSION_CLAIM_COLLECTION
                || collection_name === window.SAVE_DUMP_COLLECTION;
            if (!skipDump) {
                try {
                    await dumpExperimentLastResort(collection_name, doc_id, experiment_data, e);
                } catch (dumpErr) {
                    console.error("Last-resort dump also failed:", dumpErr);
                }
            }
            return false;
        }
    };

    window.getFromFirebase = async function(collection_name, doc_id) {
        try {
            const snap = await getDoc(doc(db, collection_name, doc_id));
            return snap.exists() ? snap.data() : null;
        } catch (e) {
            // Common during setup if rules allow write but not get — caller falls back to localStorage.
            let code = e && e.code ? String(e.code) : "";
            if (code.includes("permission-denied")) {
                console.warn(
                    "Firebase read blocked by security rules for",
                    collection_name + "/" + doc_id,
                    "— using local fallback if available. Allow 'get' (not necessarily 'list') for session restore."
                );
            } else {
                console.error("Error reading from Firebase: ", e);
            }
            return null;
        }
    };

    function getPidFromUrl() {
        try {
            let pid = new URL(window.location.href).searchParams.get("PROLIFIC_PID");
            return pid ? pid.substring(0, 10) : null;
        } catch (e) {
            return null;
        }
    }

    function makeSessionId() {
        return Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10);
    }

    function localSessionKey(pid) {
        return "fennimals_session_v1_" + pid;
    }

    /**
     * Soft-lock / session continuity (Layer 1).
     * Looks up fennimals_claims/{pid} before stimuli are built.
     * Modes: anonymous | new | continue_assignment | blocked_completed
     */
    window.resolveParticipantSessionClaim = async function() {
        const pid = getPidFromUrl();
        let forceNew = false;
        try {
            forceNew = new URL(window.location.href).searchParams.get("FORCE_NEW_SESSION") === "1";
        } catch (e) { /* ignore */ }

        if (!pid) {
            return { mode: "anonymous", pid: null, sessionId: String(Date.now()) };
        }

        let claim = await window.getFromFirebase(window.SESSION_CLAIM_COLLECTION, pid);

        // Fallback if Firestore reads are restricted: reuse local session metadata.
        if (!claim && !forceNew) {
            try {
                let localRaw = localStorage.getItem(localSessionKey(pid));
                let local = localRaw ? JSON.parse(localRaw) : null;
                if (local && local.sessionId && local.expCode) {
                    claim = {
                        activeSessionId: local.sessionId,
                        expCode: local.expCode,
                        attemptDocId: pid + "__" + local.sessionId,
                        experimentCompleted: local.experimentCompleted === true,
                        localAssignment: local.assignment || null,
                        localRestartCount: local.sessionRestartCount || 0
                    };
                }
            } catch (e) { /* ignore */ }
        }

        if (!forceNew && claim && claim.experimentCompleted === true) {
            return {
                mode: "blocked_completed",
                pid: pid,
                message: "It looks like you have already completed this study. Please return the task on Prolific if it is still listed. Thank you!"
            };
        }

        if (!forceNew && claim && claim.activeSessionId && claim.expCode) {
            let attemptDocId = claim.attemptDocId || (pid + "__" + claim.activeSessionId);
            let attempt = await window.getFromFirebase(claim.expCode, attemptDocId);

            let localAssignment = claim.localAssignment || null;
            let localRestartCount = claim.localRestartCount || 0;
            if (!localAssignment) {
                try {
                    let localRaw = localStorage.getItem(localSessionKey(pid));
                    let local = localRaw ? JSON.parse(localRaw) : null;
                    if (local && local.assignment) localAssignment = local.assignment;
                    if (local && local.sessionRestartCount) localRestartCount = local.sessionRestartCount;
                } catch (e) { /* ignore */ }
            }

            let assignment = null;
            if (attempt) {
                assignment = {
                    fennimals: attempt.fennimals || null,
                    featureMap: attempt.featureMap || null,
                    colorAssignment: attempt.colorAssignment || null,
                    phaseRandomizations: attempt.phaseRandomizations || null
                };
            } else if (localAssignment) {
                assignment = localAssignment;
            }

            let priorRestartCount = (attempt && attempt.sessionRestartCount) || localRestartCount || 0;

            try {
                localStorage.setItem(localSessionKey(pid), JSON.stringify({
                    expCode: claim.expCode,
                    sessionId: claim.activeSessionId,
                    experimentCompleted: false,
                    assignment: assignment,
                    sessionRestartCount: priorRestartCount
                }));
            } catch (e) { /* private mode / quota */ }

            return {
                mode: "continue_assignment",
                pid: pid,
                expCode: claim.expCode,
                sessionId: claim.activeSessionId,
                attemptDocId: attemptDocId,
                assignment: assignment,
                priorRestartCount: priorRestartCount
            };
        }

        return {
            mode: "new",
            pid: pid,
            sessionId: makeSessionId(),
            forceNew: forceNew
        };
    };
</script>
