<script type="module">
    // 1. Import the Firebase tools directly from Google's servers
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. PASTE YOUR CONFIG OBJECT HERE (From the Firebase Console)
    const firebaseConfig = {
        apiKey: "AIzaSyBLYsCJDNs9JO3bNi3RSCBZFHegtH1OI_I",
        authDomain: "fennimals.firebaseapp.com",
        projectId: "fennimals",
        storageBucket: "fennimals.firebasestorage.app",
        messagingSenderId: "416848310750",
        appId: "1:416848310750:web:1fd80297bf7b6389472d4f"
    };

    // 3. Initialize Firebase and create a global save function!
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // We attach this to the 'window' so your Top_controller.js can easily call it
    window.saveToFirebase = async function(experiment_name, prolific_id, experiment_data) {
        try {
            // It creates a unique folder for the experiment, and puts the participant inside it!
            const docRef = doc(db, experiment_name, prolific_id);
            await setDoc(docRef, experiment_data, { merge: true });
        } catch (e) {
            console.error("Error saving to Firebase: ", e);
        }
    };
</script>
