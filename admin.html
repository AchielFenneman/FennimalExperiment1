<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Data Exporter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; font-size: 16px;}
        button { background: #007AFF; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;}
        button:hover { background: #005bb5; }
        #status { margin-top: 15px; font-weight: bold; color: #333; }
        .auth-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Data Exporter</h2>

    <div class="auth-section">
        <p><strong>Step 1: Admin Login</strong></p>
        <input type="email" id="adminEmail" placeholder="Admin Email" value="admin@fenneland.com">
        <input type="password" id="adminPassword" placeholder="Password">
    </div>

    <div>
        <p><strong>Step 2: Download Data</strong></p>
        <input type="text" id="collectionName" value="mentalizing" placeholder="Enter experiment code">
        <button id="downloadBtn">Authenticate & Download JSON</button>
    </div>

    <div id="status"></div>
</div>

<script type="module">
    // 1. Import Firestore AND the new Firebase Auth tools
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // 2. PASTE YOUR EXACT FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyBLYsCJDNs9JO3bNi3RSCBZFHegtH1OI_I",
        authDomain: "fennimals.firebaseapp.com",
        projectId: "fennimals",
        storageBucket: "fennimals.firebasestorage.app",
        messagingSenderId: "416848310750",
        appId: "1:416848310750:web:1fd80297bf7b6389472d4f"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); // Initialize the Auth service

    document.getElementById("downloadBtn").addEventListener("click", async () => {
        const email = document.getElementById("adminEmail").value.trim();
        const password = document.getElementById("adminPassword").value.trim();
        const colName = document.getElementById("collectionName").value.trim();
        const statusEl = document.getElementById("status");

        if (!email || !password || !colName) {
            return alert("Please fill out the email, password, and collection name.");
        }

        statusEl.innerText = "Authenticating... Please wait.";
        statusEl.style.color = "blue";

        try {
            // 3. Attempt to log in with the provided credentials
            await signInWithEmailAndPassword(auth, email, password);

            statusEl.innerText = "Login successful! Fetching data...";

            // 4. If login succeeds, Firebase allows this read request!
            const querySnapshot = await getDocs(collection(db, colName));

            if (querySnapshot.empty) {
                statusEl.innerText = `No data found in collection: '${colName}'`;
                statusEl.style.color = "red";
                // Optionally log them out here so the session doesn't hang open
                auth.signOut();
                return;
            }

            // 5. Collect the raw JSON objects
            let allParticipants = [];
            querySnapshot.forEach((doc) => {
                let rawData = doc.data();
                rawData["Document_ID"] = doc.id;
                allParticipants.push(rawData);
            });

            // NEW: Filter for only completed experiments
            // We check both the root and nested levels defensively, depending on how the data was merged into Firebase
            let completedParticipants = allParticipants.filter(p =>
                p.experimentCompleted === true ||
                (p.experimentData && p.experimentData.experimentCompleted === true)
            );

            // NEW: Helper function to trigger downloads
            const downloadJSON = (dataObj, filename) => {
                const jsonString = JSON.stringify(dataObj, null, 2);
                const blob = new Blob([jsonString], { type: "application/json" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // 6. Download the full dataset immediately
            downloadJSON(allParticipants, `${colName}_all_data.json`);

            // Download the completed dataset after a tiny 500ms delay
            // (This prevents the browser from blocking multiple simultaneous downloads!)
            setTimeout(() => {
                downloadJSON(completedParticipants, `${colName}_completed_data.json`);
            }, 500);

            // Update the UI with both counts!
            statusEl.innerText = `Success! Downloaded ${allParticipants.length} total participants (${completedParticipants.length} completed).`;
            statusEl.style.color = "green";

            // 7. Log out immediately after downloading to maintain security
            auth.signOut();
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Error: Invalid password or connection issue.";
            statusEl.style.color = "red";
            auth.signOut();
        }
    });
</script>
</body>
</html>
